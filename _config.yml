# Site
title       : "Michael Edidem"
description : "Michael Edidem: geospatial AI and scientific machine learning for spatial and spatiotemporal prediction, remote sensing and computer vision, and neural surrogate modeling of environmental systems."
url         : "https://mikedidem.github.io"
baseurl     : "/medidem"
repository  : "mikedidem/medidem"
timezone    : America/Chicago
cv_url      : "https://docs.google.com/document/d/14kdMcDqHZe-kClINae_WIguH0JzedVTGU_pMqHedfeI/edit?usp=sharing"

author:
  name   : "Michael Edidem"
  email  : "edidemichael@gmail.com"
  github : "mikedidem"

# Build
include:
  - _pages
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - tmp

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: portfolio

plugins:
  - jekyll-sitemap
